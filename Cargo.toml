[workspace]
resolver = "2"
members = [
    ".",
    "serviimo-gate",
    "serviimo-office",
    "serviimo-cdn",
    "serviimo-world",
    "serviimo-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[package]
name = "serviimo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serviimo-gate = { path = "serviimo-gate" }
serviimo-office = { path = "serviimo-office" }
serviimo-cdn = { path = "serviimo-cdn" }
serviimo-world = { path = "serviimo-world" }
serviimo-store = { path = "serviimo-store" }
# The binary shares the workspace's protocol and published schema dependency.
apiimo-network = { path = "../Apiimo_src/apiimo-network" }
# ctrlc handles the requested SIGINT/Ctrl-C shutdown path.
ctrlc = "3"
# Serde loads the shared JSON configuration and applies defaults to omitted fields.
serde = { version = "1", features = ["derive"] }
# serde_json reads configuration and writes the AniiSignal runtime file.
serde_json = "1"
